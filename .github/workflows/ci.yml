name: C++ Safety Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DBUILD_TESTING=ON

    - name: Build Firmware and Tests
      run: cmake --build build

    - name: Run Catch2 Unit Tests
      working-directory: build
      run: ./tests/run_unit_tests
